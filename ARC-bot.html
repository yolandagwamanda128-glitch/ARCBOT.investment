<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ARC bot</title>
  <meta name="theme-color" content="#ffffff" />
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --raised: #eef2fa;
      --fg: #0b1530;
      --muted: #5b6785;
      --line: #e1e7f2;
      --brand: #1f4bff;
      --brand-2: #5b3df5;
      --ink: #ffffff;
      --up: #0e9f6e;
      --down: #e5484d;
      --shadow: 0 1px 2px rgba(11,21,48,.04), 0 8px 24px rgba(11,21,48,.06);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      margin: 0; background: var(--bg); color: var(--fg);
      font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.45;
    }
    button, summary { cursor: pointer; font: inherit; color: inherit; }
    button:disabled { opacity: 0.4; cursor: default; }
    :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    main { max-width: 32rem; margin: 0 auto; padding: calc(1rem + env(safe-area-inset-top, 0px)) 1rem calc(5rem + env(safe-area-inset-bottom, 0px)); }
    .mono { font-family: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: 1.25rem; }
    .logo { display: flex; align-items: center; gap: .6rem; }
    .logo svg.lg { width: 2.25rem; height: 2.25rem; flex: none; }
    .brand { font-weight: 700; font-size: 1.15rem; letter-spacing: -0.01em; margin: 0; }
    .brand i { font-style: normal; color: var(--brand); }
    h1 { font-size: 1.85rem; line-height: 1.15; letter-spacing: -0.02em; margin: .25rem 0 0; text-wrap: balance; }
    h2 { font-size: 1rem; margin: 0; letter-spacing: -0.005em; }
    .muted { color: var(--muted); }
    .card { margin-top: .9rem; background: var(--surface); border: 1px solid var(--line); border-radius: 1.1rem; padding: 1.1rem; box-shadow: var(--shadow); }
    .hero { background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%); color: #fff; border: 0; }
    .hero .muted { color: rgba(255,255,255,.78); }
    .hero .big { font-size: 2.25rem; font-weight: 700; letter-spacing: -0.02em; margin: .2rem 0 0; font-variant-numeric: tabular-nums; }
    .hero .chip { display: inline-block; margin-top: .6rem; padding: .25rem .65rem; border-radius: 999px; background: rgba(255,255,255,.18); font-size: .8rem; font-weight: 600; }
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin-top: .9rem; }
    .tiles .card { margin: 0; padding: .9rem 1rem; }
    .tiles .k { font-size: .8rem; color: var(--muted); margin: 0; }
    .tiles .v { font-size: 1.25rem; font-weight: 700; margin: .15rem 0 0; font-variant-numeric: tabular-nums; }
    label { display: block; margin-bottom: .85rem; }
    label span, .lbl { display: block; margin-bottom: .3rem; color: var(--muted); font-size: .85rem; font-weight: 500; }
    input:not([type="checkbox"]) {
      width: 100%; height: 3.1rem; border-radius: .8rem; border: 1px solid var(--line);
      background: var(--bg); color: var(--fg); padding: 0 .9rem; font-size: 1rem;
    }
    input:not([type="checkbox"]):focus { border-color: var(--brand); background: #fff; outline: 3px solid rgba(31,75,255,.14); outline-offset: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
    .sym { height: 3.6rem; border-radius: .8rem; border: 1px solid var(--line); background: var(--surface); text-align: left; padding: 0 .85rem; }
    .sym.on { background: var(--brand); color: #fff; border-color: var(--brand); }
    .sym small { display: block; font-size: .75rem; color: var(--muted); }
    .sym.on small { color: rgba(255,255,255,.85); }
    .check { display: flex; gap: .75rem; align-items: flex-start; border: 1px solid var(--line); background: var(--bg); border-radius: .8rem; padding: .8rem; margin-top: 1rem; }
    .check input { margin-top: .25rem; width: 1.15rem; height: 1.15rem; accent-color: var(--brand); }
    .go, .primary {
      height: 3.1rem; width: 100%; border: 0; border-radius: 999px; background: var(--brand); color: #fff;
      font-weight: 600; margin-top: 1rem; box-shadow: 0 6px 16px rgba(31,75,255,.28);
    }
    .err { color: var(--down); font-size: .875rem; }
    .row { display: flex; justify-content: space-between; gap: .75rem; align-items: flex-start; }
    .pill { border-radius: 999px; padding: .4rem .8rem; font-size: .72rem; font-weight: 700; letter-spacing: .04em; }
    .pill.on { background: rgba(14,159,110,.12); color: var(--up); }
    .pill.off { background: var(--raised); color: var(--muted); }
    .price { font-size: 1.75rem; font-weight: 700; margin: .25rem 0 0; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    .track { position: relative; height: .7rem; border-radius: 999px; background: var(--raised); margin-top: 1.1rem; }
    .band { position: absolute; top: 0; bottom: 0; }
    .band.l { left: 0; background: rgba(229,72,77,.28); border-radius: 999px 0 0 999px; }
    .band.r { right: 0; background: rgba(14,159,110,.28); border-radius: 0 999px 999px 0; }
    .needle { position: absolute; top: 50%; width: 4px; height: 1.3rem; background: var(--fg); border-radius: 999px; transform: translate(-50%, -50%); }
    .stat { display: flex; justify-content: space-between; align-items: baseline; gap: .75rem; }
    .btns { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }
    .btns button { height: 2.75rem; border-radius: 999px; padding: 0 1.2rem; }
    .ghost { background: var(--surface); border: 1px solid var(--line); font-weight: 500; }
    svg.chart { width: 100%; height: 8rem; display: block; margin-top: .5rem; }
    ul { list-style: none; margin: .5rem 0 0; padding: 0; }
    li { display: flex; justify-content: space-between; gap: .75rem; padding: .8rem 0; border-top: 1px solid var(--line); }
    .note { padding: .35rem 0; border: 0; display: block; font-size: .875rem; }
    pre { max-height: 16rem; overflow: auto; background: var(--bg); border-radius: .7rem; padding: .8rem; color: var(--muted); font-size: .75rem; }
    .linkish { background: none; border: 0; color: var(--muted); height: 2.75rem; padding: 0; text-decoration: underline; }
    .steps { display: flex; gap: .4rem; margin: .2rem 0 1rem; }
    .steps b { flex: 1; height: .3rem; border-radius: 999px; background: var(--line); }
    .steps b.on { background: var(--brand); }
    .qr { display: block; margin: 1rem auto .5rem; width: 12.5rem; height: 12.5rem; padding: .7rem; background: #fff; border: 1px solid var(--line); border-radius: 1rem; }
    .addr { word-break: break-all; background: var(--bg); border: 1px solid var(--line); border-radius: .8rem; padding: .8rem; font-size: .85rem; margin: .5rem 0 0; }
    .kv { display: flex; justify-content: space-between; gap: .75rem; padding: .55rem 0; border-top: 1px solid var(--line); font-size: .9rem; }
    .kv:first-of-type { border-top: 0; }
    .ok { color: var(--up); font-size: .9rem; font-weight: 600; }
    .warn { background: #fff7e6; border: 1px solid #ffe2a8; color: #7a5200; border-radius: .8rem; padding: .7rem .8rem; font-size: .85rem; margin-top: .9rem; }
    .spin { width: 3rem; height: 3rem; border-radius: 50%; border: 4px solid var(--raised); border-top-color: var(--brand); animation: sp 1s linear infinite; margin: 1.5rem auto 1rem; }
    @keyframes sp { to { transform: rotate(360deg); } }
    .syncrow { display: flex; gap: .6rem; align-items: center; padding: .5rem 0; font-size: .95rem; }
    .dot { width: .7rem; height: .7rem; border-radius: 50%; background: var(--line); flex: none; }
    .dot.on { background: var(--up); }
    .foot { text-align: center; color: var(--muted); font-size: .75rem; margin-top: 1.5rem; }
  </style>
</head>

      s.bars = s.bars.slice(-360);
      const key = dayKey(bar.t);
      if (key !== s.dayKey) { s.dayKey = key; s.dayRealized = 0; s.haltNoted = false; }
      if (s.position) {
        const pos = s.position;
        const hitSl = pos.side === "buy" ? bar.l <= pos.sl : bar.h >= pos.sl;
        const hitTp = pos.side === "buy" ? bar.h >= pos.tp : bar.l <= pos.tp;
        if (hitSl || hitTp) {
          let reason = hitSl ? "sl" : "tp";
          let price = reason === "sl" ? pos.sl : pos.tp;
          if (hitSl && hitTp && Math.abs(bar.o - pos.tp) < Math.abs(bar.o - pos.sl)) { reason = "tp"; price = pos.tp; }
          closeAt(s, price, reason, bar.t, spec);
        }
      }
      if (!s.position) tryEntry(s, bar, spec);
      pushEq(s, spec);
    }
    function quiet(s) {
      const spec = specOf(s.settings.symbol);
      const rng = mulberry(s.rng);
      const prev = s.bars[s.bars.length - 1];
      const bar = nextBar(prev, spec, rng, prev.t + BAR);
      s.rng = rng.state();
      s.bars.push(bar);
      const key = dayKey(bar.t);
      if (key !== s.dayKey) { s.dayKey = key; s.dayRealized = 0; s.haltNoted = false; }
      pushEq(s, spec);
    }
    function createSession(input) {
      const spec = specOf(input.symbol);
      const end = Math.floor(Date.now() / BAR) * BAR;
      const start = end - 170 * BAR;
      let seed = 2166136261;
      const stamp = input.login + "|" + input.server + "|" + input.symbol + "|" + end;
      for (let i = 0; i < stamp.length; i++) { seed ^= stamp.charCodeAt(i); seed = Math.imul(seed, 16777619); }
      const s = {
        login: input.login.trim(), server: input.server.trim(), startBalance: input.balance,
        settings: { symbol: input.symbol, risk: 0.005, maxDailyLoss: 0.03, minConfidence: 0.6, slAtr: 1.5, tpAtr: 2.5, live: input.live },
        armed: true, speed: "fast", rng: seed >>> 0,
        bars: [{ t: start, o: spec.start, h: spec.start, l: spec.start, c: spec.start }],
        cash: input.balance, position: null, trades: [], dayKey: dayKey(start), dayRealized: 0, haltNoted: false,
        notes: [], equityPoints: [{ t: start, v: input.balance }], nextId: 1
      };
      for (let i = 0; i < 80; i++) quiet(s);
      for (let i = 0; i < 90; i++) step(s);
      note(s, s.bars[s.bars.length - 1].t, "Robot armed on the paper book. Tape is simulated.");
      return s;
    }
    function snapshot(s) {
      const spec = specOf(s.settings.symbol);
      const last = s.bars[s.bars.length - 1];
      const f = features(s.bars);
      const pUp = f ? probability(f) : 0.5;
      const floating = s.position ? pnlAt(s.position, last.c, spec) : 0;
      const locked = s.dayRealized < -s.settings.maxDailyLoss * s.cash;
      const min = s.settings.minConfidence;
      const call = locked ? "Halted" : pUp >= min ? "Buy" : pUp <= 1 - min ? "Sell" : "Wait";
      return { spec, last, pUp, floating, equity: s.cash + floating, locked, call };
    }
    function scriptText(s) {
      const st = s.settings;
      return [
        "# ARC bot robot settings for account " + s.login + " on " + s.server,
        "SYMBOL = " + st.symbol,
        "RISK_PER_TRADE = " + st.risk,
        "MAX_DAILY_LOSS = " + st.maxDailyLoss,
        "MIN_CONFIDENCE = " + st.minConfidence,
        "SL_ATR = " + st.slAtr,
        "TP_ATR = " + st.tpAtr,
        "ALLOW_LIVE = " + (st.live ? "True" : "False"),
        "",
        "Run this profile only in the MetaTrader terminal that is already logged into " + s.login + ".",
        "This app does not send orders to the broker."
      ].join("\n");
    }

    function save() { if (session) localStorage.setItem(KEY, JSON.stringify(session)); else localStorage.removeItem(KEY); }
    function armClock() {
      clearInterval(timer);
      if (!session || !session.armed) return;
      timer = setInterval(() => { step(session); save(); render(); }, session.speed === "fast" ? 900 : 3200);
    }

    function line(points) {
      if (points.length < 2) return "";
      const vs = points.map((p) => p.v);
      const min = Math.min(...vs), max = Math.max(...vs);
      const span = Math.max(max - min, 1);
      const d = points.map((p, i) => {
        const x = (i / (points.length - 1)) * 100;
        const y = 8 + (1 - (p.v - min) / span) * 84;
        return (i ? "L" : "M") + x.toFixed(2) + " " + y.toFixed(2);
      }).join(" ");
      const up = points[points.length - 1].v >= points[0].v;
      return '<svg class="chart" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="' + d + '" fill="none" stroke="' + (up ? "var(--up)" : "var(--down)") + '" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>';
    }

    function render() {
      const root = document.getElementById("app");
      if (!session && flow && syncStep > 0) { root.innerHTML = syncHtml(); return; }
      if (!session && flow) { root.innerHTML = depositHtml(); bindDeposit(); return; }
      if (!session) { root.innerHTML = linkHtml(); bindLink(); return; }
      const v = snapshot(session);
      const cls = v.call === "Buy" ? "up" : v.call === "Wait" ? "muted" : "down";
      const band = (1 - session.settings.minConfidence) * 100;
      const wins = session.trades.filter((t) => t.pnl > 0).length;
      root.innerHTML = `
        <div class="top"><div class="logo"><svg class="lg" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f4bff"/><stop offset="1" stop-color="#5b3df5"/></linearGradient></defs><rect width="48" height="48" rx="13" fill="url(#g)"/><path d="M11 33 24 12l13 21" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 27h14" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg><p class="brand">ARC <i>bot</i></p></div><span class="pill ${session.armed ? "on" : "off"}">${session.armed ? "ARMED" : "PAUSED"}</span></div>
        <h1 style="font-size:1.1rem;letter-spacing:0">${esc(session.login)} <span class="muted">· ${esc(session.server)}</span></h1>
        <p class="muted" style="margin:.2rem 0 0">${session.settings.live ? "Live profile" : "Demo profile"} · paper book · not logged into the terminal</p>
        <section class="card">
          <div class="row">
            <div>
              <p class="mono muted" style="margin:0;font-size:0.75rem">${esc(v.spec.id)} · simulated M15 tape</p>
              <p class="price">${v.last.c.toFixed(v.spec.digits)}</p>
              <p class="muted" style="margin:0.25rem 0 0">${when(v.last.t)} SAST</p>
            </div>
            <div style="text-align:right">
              <p class="mono muted" style="margin:0;font-size:0.75rem">Signal</p>
              <p class="price ${cls}">${v.call}</p>
              <p class="mono muted" style="margin:0.25rem 0 0">score ${pct(v.pUp)}</p>
            </div>
          </div>
          <div class="track">
            <div class="band l" style="width:${band}%"></div>
            <div class="band r" style="width:${band}%"></div>
            <div class="needle" style="left:${Math.max(0, Math.min(100, v.pUp * 100))}%"></div>
          </div>
          <p class="muted">Buys at or above ${pct(session.settings.minConfidence)}. Sells at or below ${pct(1 - session.settings.minConfidence)}. One ticket at a time.</p>
          ${v.locked ? '<p class="down">Day halt is on. No new ticket until the next Johannesburg session.</p>' : ""}
        </section>
        <section class="card hero"><p class="muted" style="margin:0">Account balance</p><p class="big">${usd(v.equity)}</p><span class="chip">${(v.equity - session.startBalance >= 0 ? "+" : "") + usd(v.equity - session.startBalance)} since start</span></section>
        <div class="tiles">
          <div class="card"><p class="k">Today</p><p class="v ${session.dayRealized < 0 ? "down" : "up"}">${usd(session.dayRealized)}</p><p class="k">halt ${usd(-session.settings.maxDailyLoss * session.cash)}</p></div>
          <div class="card"><p class="k">Closed</p><p class="v">${wins}/${session.trades.length}</p><p class="k">${session.trades.length ? pct(wins / session.trades.length) + " wins" : "no fills yet"}</p></div>
        </div>
        <section class="card">
          ${session.position ? `<div class="row"><div><p class="muted" style="margin:0">Open ticket</p><p class="mono" style="margin:0.25rem 0 0">${session.position.side === "buy" ? "Buy" : "Sell"} ${session.position.lots.toFixed(2)}</p><p class="muted mono">in ${session.position.entry.toFixed(v.spec.digits)} · stop ${session.position.sl.toFixed(v.spec.digits)} · target ${session.position.tp.toFixed(v.spec.digits)}</p></div><p class="price ${v.floating >= 0 ? "up" : "down"}" style="font-size:1.25rem">${usd(v.floating)}</p></div>` : `<p class="muted" style="margin:0">Open ticket</p><p>Flat. Waiting for a bar outside the no-trade band.</p>`}
          <div class="btns">
            <button class="primary" id="arm" style="width:auto;margin:0">${session.armed ? "Pause" : "Arm"}</button>
            <button class="ghost" id="flat" ${session.position ? "" : "disabled"}>Flatten</button>
            <button class="ghost" id="speed">${session.speed === "fast" ? "Fast tape" : "Slow tape"}</button>
          </div>
        </section>
        <section class="card"><h2>Equity curve</h2>${line(session.equityPoints)}</section>
        <section class="card"><h2>Fills</h2><ul>${session.trades.slice(0, 8).map((t) => `<li><span>${t.side === "buy" ? "Buy" : "Sell"} ${t.lots.toFixed(2)} · ${t.reason === "tp" ? "target" : t.reason === "sl" ? "stop" : "flat"}<br><span class="muted">${when(t.closedAt)}</span></span><strong class="mono ${t.pnl >= 0 ? "up" : "down"}">${usd(t.pnl)}</strong></li>`).join("") || '<li class="muted">No closed tickets yet.</li>'}</ul></section>
        <section class="card"><h2>Robot log</h2>${session.notes.map((n) => `<p class="note"><span class="mono muted">${when(n.t)}</span> ${esc(n.text)}</p>`).join("")}</section>
        <section class="card">
          <h2>Send orders into MetaTrader</h2>
          <p class="muted">Only the Windows terminal logged into ${esc(session.login)} can send tickets. This app never asks for your password.</p>
          <button class="ghost" id="copy">${copied ? "Copied" : "Copy profile"}</button>
          <details style="margin-top:0.75rem"><summary class="muted">Show the profile</summary><pre>${esc(scriptText(session).replace(/\\n/g, "\n"))}</pre></details>
        </section>
        <div style="margin-top:1rem">${confirmCut ? `<p class="muted">Remove this account link from the device? Your deposited balance is kept for the next login.</p><button class="primary" id="yes" style="width:auto">Remove</button> <button class="ghost" id="no">Keep</button>` : `<button class="linkish" id="cut">Remove account link</button>`}</div>`;
      bindDesk();
    }


    function depositHtml() {
      return `
        <div class="top"><div class="logo"><svg class="lg" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f4bff"/><stop offset="1" stop-color="#5b3df5"/></linearGradient></defs><rect width="48" height="48" rx="13" fill="url(#g)"/><path d="M11 33 24 12l13 21" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 27h14" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg><p class="brand">ARC <i>bot</i></p></div></div>
        <div class="steps"><b class="on"></b><b class="on"></b><b></b></div>
        <h1>Fund your bot</h1>
        <p class="muted">Deposit at least <b style="color:var(--fg)">$${MIN_DEPOSIT} USDT</b> to start. Your deposit becomes the bot's starting balance.</p>
        <section class="card">
          <svg class="qr" viewBox="-2 -2 ${QR_N + 4} ${QR_N + 4}" shape-rendering="crispEdges" role="img" aria-label="Deposit address QR"><rect x="-2" y="-2" width="${QR_N + 4}" height="${QR_N + 4}" fill="#fff"/><path d="${QR_PATH}" fill="#0b1530"/></svg>
          <div class="kv"><span class="muted">Asset</span><b>USDT</b></div>
          <div class="kv"><span class="muted">Network</span><b>BNB Smart Chain (BEP20)</b></div>
          <div class="kv"><span class="muted">Minimum</span><b>$${MIN_DEPOSIT}</b></div>
          <p class="addr mono">${DEPOSIT_ADDRESS}</p>
          <div class="btns"><button class="ghost" id="copyaddr">${copied ? "Copied" : "Copy address"}</button></div>
          <div class="warn">Send only USDT on BSC (BEP20) to this address. Other coins or networks will be lost. Do not send NFTs.</div>
        </section>
        <form class="card" id="depform">
          <h2>I have sent it</h2>
          <p class="muted" style="margin:.3rem 0 .8rem">Paste the transaction hash (TxID) from your wallet. ARC bot checks it on the BSC chain.</p>
          <label style="margin:0"><input class="mono" id="txhash" placeholder="0x…" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(draft.tx || "")}" /></label>
          ${depMsg ? `<p class="${depMsg.startsWith("OK") ? "ok" : "err"}" style="margin:.7rem 0 0">${esc(depMsg)}</p>` : ""}
          <button class="go" type="submit" ${depBusy ? "disabled" : ""}>${depBusy ? "Checking…" : "Verify deposit"}</button>
        </form>
        <div style="margin-top:1rem"><button class="linkish" id="back">Back to log in</button></div>`;
    }
    function bindDeposit() {
      document.getElementById("copyaddr").onclick = () => {
        try { if (window.ArcNative && ArcNative.copy) ArcNative.copy(DEPOSIT_ADDRESS); else navigator.clipboard.writeText(DEPOSIT_ADDRESS); copied = true; } catch { copied = false; }
        render(); setTimeout(() => { copied = false; }, 1500);
      };
      document.getElementById("back").onclick = () => { flow = null; saveFlow(); render(); };
      document.getElementById("depform").onsubmit = async (e) => {
        e.preventDefault();
        const hash = document.getElementById("txhash").value.trim();
        draft.tx = hash;
        if (!/^0x[0-9a-fA-F]{64}$/.test(hash)) { depMsg = "Enter the full transaction hash (0x followed by 64 characters)."; render(); return; }
        if (usedTxs().includes(hash.toLowerCase())) { depMsg = "That transaction was already used."; render(); return; }
        depBusy = true; depMsg = ""; render();
        try {
          const r = await checkDeposit(hash);
          if (r.ok) {
            credit = { amount: r.amount, hash: r.hash, at: Date.now() };
            localStorage.setItem(CREDIT_KEY, JSON.stringify(credit));
            localStorage.setItem(USED_KEY, JSON.stringify(usedTxs().concat(hash.toLowerCase())));
            depBusy = false; startSync(); return;
          }
          depMsg = r.msg;
        } catch (err) { depMsg = "Could not reach the BSC network. Check your connection and try again."; }
        depBusy = false; render();
      };
    }
    const SYNC_STEPS = ["Deposit confirmed", "Linking MT5 profile", "Loading chart for the chosen asset", "Starting the robot"];
    function syncHtml() {
      return `
        <div class="top"><div class="logo"><p class="brand">ARC <i>bot</i></p></div></div>
        <div class="steps"><b class="on"></b><b class="on"></b><b class="on"></b></div>
        <h1>Syncing with MT5</h1>
        <section class="card"><div class="spin"></div>
          ${SYNC_STEPS.map((t, i) => `<div class="syncrow"><span class="dot ${i < syncStep ? "on" : ""}"></span><span class="${i < syncStep ? "" : "muted"}">${t}</span></div>`).join("")}
        </section>`;
    }
    function startSync() {
      syncStep = 1; render();
      const tick = () => {
        if (syncStep >= SYNC_STEPS.length) {
          session = createSession({ login: flow.login, server: flow.server, balance: credit.amount, symbol: flow.symbol, live: flow.live });
          syncStep = 0; save(); armClock(); render(); return;
        }
        setTimeout(() => { syncStep++; render(); tick(); }, 900);
      };
      tick();
    }
    function linkHtml() {
      return `
        <div class="top"><div class="logo"><svg class="lg" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f4bff"/><stop offset="1" stop-color="#5b3df5"/></linearGradient></defs><rect width="48" height="48" rx="13" fill="url(#g)"/><path d="M11 33 24 12l13 21" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 27h14" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg><p class="brand">ARC <i>bot</i></p></div></div>
        <div class="steps"><b class="on"></b><b></b><b></b></div>
        <h1>Log in to ARC bot</h1>
        <p class="muted">Enter your MT5 account details and pick the asset to watch. Next you will fund the bot, then it syncs with your MT5 profile.</p>
        <form class="card" id="form">
          <label><span>Account number</span><input class="mono" id="login" inputmode="numeric" placeholder="50123478" value="${esc(draft.login)}" /></label>
          <label><span>Server</span><input id="server" placeholder="BrokerName-Demo" value="${esc(draft.server)}" /></label>
          <p class="lbl">Symbol</p>
          <div class="grid">${SYMBOLS.map((s) => `<button type="button" class="sym ${draft.symbol === s.id ? "on" : ""}" data-sym="${s.id}"><b class="mono">${s.id}</b><small>${s.label}</small></button>`).join("")}</div>
          <label class="check"><input type="checkbox" id="live" ${draft.live ? "checked" : ""} /><span><b style="color:var(--fg)">This is a live account</b><span class="muted">Leave this off for a demo. The app still paper-trades either way.</span></span></label>
          ${error ? `<p class="err">${esc(error)}</p>` : ""}
          <button class="go" type="submit">Continue</button>
          <p class="muted">Your password stays inside MetaTrader. This app cannot place broker tickets.</p>
        </form>`;
    }
    function readDraft() {
      draft.login = document.getElementById("login").value.replace(/\D/g, "").slice(0, 12);
      draft.server = document.getElementById("server").value;
      draft.live = document.getElementById("live").checked;
    }
    function bindLink() {
      document.querySelectorAll("[data-sym]").forEach((btn) => btn.onclick = () => { readDraft(); draft.symbol = btn.dataset.sym; render(); });
      document.getElementById("form").onsubmit = (e) => {
        e.preventDefault();
        readDraft();
        if (!/^\d{4,12}$/.test(draft.login.trim())) error = "Account number should be 4 to 12 digits.";
        else if (draft.server.trim().length < 3) error = "Enter the server name shown in MetaTrader.";
        else {
          error = "";
          flow = { login: draft.login.trim(), server: draft.server.trim(), symbol: draft.symbol, live: draft.live };
          saveFlow(); depMsg = "";
          if (credit) startSync();
        }
        render();
      };
    }
    function bindDesk() {
      document.getElementById("arm").onclick = () => { session.armed = !session.armed; save(); armClock(); render(); };
      document.getElementById("flat").onclick = () => {
        if (!session.position) return;
        const spec = specOf(session.settings.symbol);
        const last = session.bars[session.bars.length - 1];
        const exit = session.position.side === "buy" ? last.c - spec.spread / 2 : last.c + spec.spread / 2;
        closeAt(session, exit, "flat", last.t, spec);
        pushEq(session, spec);
        save(); render();
      };
      document.getElementById("speed").onclick = () => { session.speed = session.speed === "fast" ? "desk" : "fast"; save(); armClock(); render(); };
      document.getElementById("copy").onclick = async () => {
        const txt = scriptText(session).replace(/\\n/g, "\n"); try { if (window.ArcNative && ArcNative.copy) { ArcNative.copy(txt); copied = true; } else { await navigator.clipboard.writeText(txt); copied = true; } } catch { copied = false; }
        render();
      };
      const cut = document.getElementById("cut");
      if (cut) cut.onclick = () => { confirmCut = true; render(); };
      const yes = document.getElementById("yes");
      if (yes) yes.onclick = () => { session = null; flow = null; saveFlow(); confirmCut = false; copied = false; save(); armClock(); render(); };
      const no = document.getElementById("no");
      if (no) no.onclick = () => { confirmCut = false; render(); };
    }

    try { session = JSON.parse(localStorage.getItem(KEY) || "null"); if (!session || !session.bars) session = null; } catch { session = null; }
    armClock();
    render();
  </script>
</body>
</html>
