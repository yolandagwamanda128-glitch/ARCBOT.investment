name: Build and publish Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unpack Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir android-src
          unzip -q ARC-bot-android-project.zip -d android-src
          wrapper="$(find "$PWD/android-src" -type f -name gradlew -print -quit)"
          if [[ -z "$wrapper" ]]; then
            echo "No Gradle wrapper (gradlew) found in ARC-bot-android-project.zip" >&2
            exit 1
          fi
          echo "ANDROID_PROJECT_DIR=$(dirname "$wrapper")" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/apk"
          find . -type f -path '*/build/outputs/apk/*' -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/apk/" \;
          if ! compgen -G "$GITHUB_WORKSPACE/apk/*.apk" > /dev/null; then
            echo "Gradle completed but no APK was found" >&2
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARCBOT-android-apk
          path: apk/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ARCBOT-android-apk
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
